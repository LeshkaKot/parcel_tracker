services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: parcel_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qwerty123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=parcel_tracker
      - DB_USER=postgres
      - DB_PASSWORD=qwerty123
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: